name: PostgreSQL Integration

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  postgres-integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uair_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d uair_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/uair_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Deliberately install only the dependencies needed by this gate.
      # This avoids coupling the database integration test to optional
      # ecosystem adapters/packages.
      - name: Install integration toolchain
        run: |
          mkdir -p .ci
          npm install \
            --prefix .ci \
            --no-package-lock \
            --ignore-scripts \
            typescript@^5.9.2 \
            @types/node@^24.3.0 \
            pg@^8.13.0

      - name: Wire local UAIR packages
        run: |
          mkdir -p node_modules/@uair
          ln -s "$GITHUB_WORKSPACE/packages/core" node_modules/@uair/core
          ln -s "$GITHUB_WORKSPACE/packages/postgres" node_modules/@uair/postgres
          ln -s "$GITHUB_WORKSPACE/.ci/node_modules/@types" node_modules/@types
          ln -s "$GITHUB_WORKSPACE/.ci/node_modules/pg" node_modules/pg

      - name: Build core and PostgreSQL adapter
        run: |
          .ci/node_modules/.bin/tsc -p packages/core/tsconfig.json
          .ci/node_modules/.bin/tsc -p packages/postgres/tsconfig.json

      - name: Run real PostgreSQL multi-connection gate
        run: |
          node examples/postgres-integration/index.mjs
